name: 'Code Review Agent by boghus'
description: 'AI-powered Pull Request reviewer. Posts a single, idempotent review comment. Provider-agnostic (Gemini first).'
author: 'boghus'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  api-key:
    description: 'API key for the AI provider. Map any repository secret to this input.'
    required: false
  performance-only:
    description: 'QA-only mode: measures internal preparation without calling the AI provider.'
    required: false
    default: 'false'
  model:
    description: 'Model identifier passed to the AI provider (e.g. gemini-3.6-flash).'
    required: false
    default: 'gemini-3.6-flash'
  provider:
    description: 'AI provider implementation. Currently only "gemini" is supported.'
    required: false
    default: 'gemini'
  language:
    description: 'Language for the generated review. Supported values: en, es. Invalid values default to en.'
    required: false
    default: 'en'
  rules-path:
    description: "Repository-relative Git tree path to trusted review rules. Absolute paths, leading '-', and '.', '..' path components are rejected. Rules are always read from the PR base ref."
    required: false
    default: '.github/code_review_rules.md'
  diff-path:
    description: 'Path where the PR diff is written before review.'
    required: false
    default: 'cra-pr.diff'
  output-path:
    description: 'Path where the generated review is written before posting.'
    required: false
    default: 'cra-review.md'
  github-token:
    description: 'GitHub token used to post the comment. Defaults to GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  max-diff-bytes:
    description: 'Skip the review with a warning when the diff exceeds this many bytes. Default 200000.'
    required: false
    default: '200000'
  max-diff-lines:
    description: 'Skip the review with a warning when the diff exceeds this many lines. Default 4000.'
    required: false
    default: '4000'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Checkout PR head
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Fetch PR base
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch --no-tags origin \
          "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
        if ! git cat-file -e "$BASE_SHA^{commit}"; then
          echo "::error::PR base commit $BASE_SHA is not available after fetching refs/heads/$BASE_REF." >&2
          exit 1
        fi
    - name: Resolve path inputs
      id: resolve-paths
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        RULES_RAW: ${{ inputs.rules-path }}
        DIFF_RAW: ${{ inputs.diff-path }}
        OUTPUT_RAW: ${{ inputs.output-path }}
      run: |
        resolve_runner() {
          local raw="$1"
          if [[ "$raw" == /* ]]; then
            echo "$raw"
          else
            echo "$WORKSPACE/$raw"
          fi
        }
        if [[ "$RULES_RAW" == /* ]]; then
          echo "::error::rules-path must be a path inside the repository, not an absolute filesystem path. Got: $RULES_RAW" >&2
          exit 1
        fi
        {
          echo "diff-path=$(resolve_runner "$DIFF_RAW")"
          echo "output-path=$(resolve_runner "$OUTPUT_RAW")"
          echo "rules-relative=$RULES_RAW"
        } >> "$GITHUB_OUTPUT"

    - name: Run Code Review Agent
      shell: bash
      env:
        GITHUB_TOKEN: ''
        CRA_API_KEY: ${{ inputs.api-key }}
        CRA_PERFORMANCE_ONLY: ${{ inputs.performance-only }}
        CRA_PROVIDER: ${{ inputs.provider }}
        CRA_MODEL: ${{ inputs.model }}
        CRA_LANGUAGE: ${{ inputs.language }}
        CRA_RULES_PATH: ${{ steps.resolve-paths.outputs.rules-relative }}
        CRA_DIFF_PATH: ${{ steps.resolve-paths.outputs.diff-path }}
        CRA_OUTPUT_PATH: ${{ steps.resolve-paths.outputs.output-path }}
        CRA_REPOSITORY: ${{ github.repository }}
        CRA_PULL_REQUEST: ${{ github.event.pull_request.number }}
        CRA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CRA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CRA_ACTION_REF: ${{ github.action_ref || github.event.pull_request.head.ref || github.ref_name }}
        CRA_ACTION_SHA: ${{ github.action_sha || github.event.pull_request.head.sha || github.sha }}
        CRA_MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        CRA_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
      run: |
        started_at=$(date +%s%3N)
        echo "::group::Code Review Agent runtime diagnostics"
        echo "Gradle version:"
        gradle --version | sed -n '1,8p'
        echo "Java version:"
        java -version 2>&1 | head -n 3
        echo "Workspace: $GITHUB_WORKSPACE"
        echo "Action path: $GITHUB_ACTION_PATH"
        echo "Performance-only: $CRA_PERFORMANCE_ONLY"
        echo "Base SHA: $CRA_BASE_SHA"
        echo "Head SHA: $CRA_HEAD_SHA"
        echo "::endgroup::"

        if [[ "$CRA_PERFORMANCE_ONLY" == "true" ]]; then
          echo "::group::Gradle build/runtime diagnostics"

          measure_gradle() {
            local label="$1"
            shift
            local started
            local finished
            local status

            started=$(date +%s%3N)
            echo "Starting: $label"
            gradle -p "$GITHUB_ACTION_PATH" "$@" --no-daemon --quiet
            status=$?
            finished=$(date +%s%3N)
            echo "Gradle diagnostic: $label = $((finished - started)) ms (exit=$status)"

            return "$status"
          }

          measure_gradle "help" help
          help_status=$?

          measure_gradle "tasks" tasks
          tasks_status=$?

          measure_gradle "classes" classes
          classes_status=$?

          measure_gradle "jar" jar
          jar_status=$?

          if [[ "$jar_status" -eq 0 ]]; then
            echo "Generated JARs:"
            find "$GITHUB_ACTION_PATH/build/libs" -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort
          fi

          echo "::endgroup::"

          if [[ "$help_status" -ne 0 || "$tasks_status" -ne 0 || "$classes_status" -ne 0 || "$jar_status" -ne 0 ]]; then
            echo "::error::Gradle diagnostic command failed."
            exit 1
          fi
        fi

        set +e
        gradle -p "$GITHUB_ACTION_PATH" run --no-daemon --quiet --profile
        status=$?
        finished_at=$(date +%s%3N)
        echo "Code Review Agent Gradle execution: $((finished_at - started_at)) ms"

        profile=$(find "$GITHUB_ACTION_PATH/build/reports/profile" -type f -name '*.html' -printf '%T@ %p\\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)
        if [[ -n "$profile" ]]; then
          echo "Gradle profile generated: $profile"
        else
          echo "Gradle profile: not generated"
        fi

        exit "$status"

    - name: Find previous review comment
      id: find-comment
      uses: peter-evans/find-comment@v4
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: github-actions[bot]
        body-regex: '<!-- code-review-agent-by-boghus -->|<!-- code-review-agent -->'

    - name: Create or update review comment
      uses: peter-evans/create-or-update-comment@v5
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        body-path: ${{ steps.resolve-paths.outputs.output-path }}
        edit-mode: replace

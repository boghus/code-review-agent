name: 'Code Review Agent by boghus'
description: 'AI-powered Pull Request reviewer. Posts a single, idempotent review comment. Provider-agnostic (Gemini first).'
author: 'boghus'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  api-key:
    description: 'API key for the AI provider. Map any repository secret to this input.'
    required: true
  model:
    description: 'Model identifier passed to the AI provider (e.g. gemini-3.6-flash).'
    required: false
    default: 'gemini-3.6-flash'
  provider:
    description: 'AI provider implementation. Currently only "gemini" is supported.'
    required: false
    default: 'gemini'
  language:
    description: 'Language for the generated review. Supported values: en, es. Invalid values default to en.'
    required: false
    default: 'en'
  rules-path:
    description: "Repository-relative Git tree path to trusted review rules. Absolute paths, leading '-', and '.', '..' path components are rejected. Rules are always read from the PR base ref."
    required: false
    default: '.github/code_review_rules.md'
  diff-path:
    description: 'Path where the PR diff is written before review.'
    required: false
    default: 'cra-pr.diff'
  output-path:
    description: 'Path where the generated review is written before posting.'
    required: false
    default: 'cra-review.md'
  github-token:
    description: 'GitHub token used to post the comment. Defaults to GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  max-diff-bytes:
    description: 'Skip the review with a warning when the diff exceeds this many bytes. Default 200000.'
    required: false
    default: '200000'
  max-diff-lines:
    description: 'Skip the review with a warning when the diff exceeds this many lines. Default 4000.'
    required: false
    default: '4000'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Checkout PR head
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Resolve path inputs
      id: resolve-paths
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        RULES_RAW: ${{ inputs.rules-path }}
        DIFF_RAW: ${{ inputs.diff-path }}
        OUTPUT_RAW: ${{ inputs.output-path }}
      run: |
        resolve_runner() {
          local raw="$1"
          if [[ "$raw" == /* ]]; then
            echo "$raw"
          else
            echo "$WORKSPACE/$raw"
          fi
        }
        # Keep rules-path as data passed through the environment; it is never
        # interpolated into this Bash source. Full validation is performed by
        # the Groovy trusted-rules loader before any Git access.
        if [[ "$RULES_RAW" == /* ]]; then
          echo "::error::rules-path must be a path inside the repository, not an absolute filesystem path. Got: $RULES_RAW" >&2
          exit 1
        fi
        {
          echo "diff-path=$(resolve_runner "$DIFF_RAW")"
          echo "output-path=$(resolve_runner "$OUTPUT_RAW")"
          echo "rules-relative=$RULES_RAW"
        } >> "$GITHUB_OUTPUT"

    - name: Run Code Review Agent
      shell: bash
      env:
        # Explicitly remove the GitHub token from the AI process boundary.
        # GitHub API operations belong exclusively to the comment steps below.
        GITHUB_TOKEN: ''
        CRA_API_KEY: ${{ inputs.api-key }}
        CRA_PROVIDER: ${{ inputs.provider }}
        CRA_MODEL: ${{ inputs.model }}
        CRA_LANGUAGE: ${{ inputs.language }}
        CRA_RULES_PATH: ${{ steps.resolve-paths.outputs.rules-relative }}
        CRA_DIFF_PATH: ${{ steps.resolve-paths.outputs.diff-path }}
        CRA_OUTPUT_PATH: ${{ steps.resolve-paths.outputs.output-path }}
        CRA_REPOSITORY: ${{ github.repository }}
        CRA_PULL_REQUEST: ${{ github.event.pull_request.number }}
        CRA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CRA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CRA_ACTION_REF: ${{ github.action_ref || github.event.pull_request.head.ref || github.ref_name }}
        CRA_ACTION_SHA: ${{ github.action_sha || github.event.pull_request.head.sha || github.sha }}
        CRA_MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        CRA_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
      run: gradle -p "$GITHUB_ACTION_PATH" run --no-daemon --quiet

    - name: Find previous review comment
      id: find-comment
      uses: peter-evans/find-comment@v4
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: github-actions[bot]
        # Accept both the new marker and the legacy v1 marker so existing
        # comments from earlier releases are picked up and replaced in
        # place instead of producing a duplicate.
        body-regex: '<!-- code-review-agent-by-boghus -->|<!-- code-review-agent -->'

    - name: Create or update review comment
      uses: peter-evans/create-or-update-comment@v5
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        body-path: ${{ steps.resolve-paths.outputs.output-path }}
        edit-mode: replace

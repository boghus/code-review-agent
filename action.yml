name: Code Review Agent

description: AI-powered code review agent for GitHub Pull Requests, built with Groovy.

inputs:
  api-key:
    description: API key used by the configured AI provider.
    required: true
  model:
    description: AI model to use for the review.
    required: true
    default: gemini-2.5-flash

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Run Code Review Agent
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        MODEL: ${{ inputs.model }}
      run: gradle -p "${{ github.action_path }}" run

plugins {
    id 'groovy'
    id 'application'
    id 'jacoco'
}

group = 'com.boghus.codereview'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation localGroovy()
    implementation 'com.google.genai:google-genai:1.61.0'
    implementation 'org.apache.groovy:groovy-json:5.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

application {
    mainClass = 'com.boghus.codereview.CodeReview'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('reportDiffCoverage') {
    group = 'verification'
    description = 'Analyzes JaCoCo coverage for executable lines changed since a git base commit'

    doLast {
        String diffSha = project.findProperty('diffSha')
        String report = project.findProperty('report')
        if (!diffSha) {
            throw new GradleException('Missing required --diffSha argument')
        }
        if (!report) {
            throw new GradleException('Missing required --report argument')
        }

        File reportFile = file(report)
        def result = com.boghus.codereview.coverage.DiffCoverageAnalyzer.analyze(
            diffSha,
            reportFile,
            project.projectDir
        )

        File outputFile = file(project.findProperty('output') ?: 'build/reports/coverage/report.txt')
        com.boghus.codereview.coverage.DiffCoverageAnalyzer.writeReport(result, outputFile)

        if (result.analyzedLines == 0) {
            logger.lifecycle('No executable lines found in the changed code')
        } else {
            logger.lifecycle("Diff coverage: \${result.coveredLines}/\${result.analyzedLines} (\${result.coveredLines * 100.0 / result.analyzedLines}%)")
            logger.lifecycle("Report saved to: \${outputFile}")
        }
    }
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-options']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

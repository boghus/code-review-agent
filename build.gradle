plugins {
    id 'groovy'
    id 'application'
}

group = 'com.boghus.codereview'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation localGroovy()
    implementation 'com.google.genai:google-genai:1.61.0'
    implementation 'org.apache.groovy:groovy-json:5.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

application {
    mainClass = 'com.boghus.codereview.CodeReview'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-options']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

name: QA performance measurement

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/performance-29.yml'
      - 'action.yml'
      - 'src/main/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  performance:
    if: github.event.pull_request.head.ref == 'qa/performance-29'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Code Review Agent in performance-only mode
        uses: ./
        with:
          performance-only: 'true'

      - name: Upload Gradle performance profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-performance-profile
          path: build/reports/profile/*.html
          if-no-files-found: warn

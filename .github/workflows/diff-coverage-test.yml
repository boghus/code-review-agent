name: Diff Coverage Experiment

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-coverage:
    name: Diff coverage
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug Git context
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "=== GitHub context ==="
          echo "event: $EVENT_NAME"
          echo "ref: $REF"
          echo "base_sha: $BASE_SHA"
          echo "head_sha: $HEAD_SHA"
          echo "github_sha: $GITHUB_SHA"
          echo
          echo "=== Git status ==="
          git status --short
          echo
          echo "=== Current commit ==="
          git rev-parse HEAD
          echo
          echo "=== Changed files: base -> HEAD ==="
          git diff --name-status "$BASE_SHA" "$HEAD_SHA"
          echo
          echo "=== Changed source files: base -> HEAD ==="
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.groovy' '*.java' '*.kt'

      - name: Generate JaCoCo
        run: |
          echo "=== Generating JaCoCo report ==="
          gradle jacocoTestReport --no-daemon
          echo
          echo "=== JaCoCo files ==="
          find build/reports/jacoco -maxdepth 4 -type f -print | sort
          echo
          echo "=== JaCoCo XML ==="
          test -f build/reports/jacoco/test/jacocoTestReport.xml
          wc -c build/reports/jacoco/test/jacocoTestReport.xml

      - name: Generate diff coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "=== Running diff coverage ==="
          echo "diffSha: $BASE_SHA"
          echo "report: build/reports/jacoco/test/jacocoTestReport.xml"
          gradle reportDiffCoverage --no-daemon \
            --diffSha="$BASE_SHA" \
            --report=build/reports/jacoco/test/jacocoTestReport.xml
          exit_code=$?
          echo "diff coverage exit code: $exit_code"
          echo
          echo "=== Coverage report directory ==="
          if [ -d build/reports/coverage ]; then
            find build/reports/coverage -maxdepth 3 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          else
            echo "build/reports/coverage does not exist"
          fi
          exit "$exit_code"

      - name: Publish HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/
          if-no-files-found: error

      - name: Read diff coverage result
        id: coverage
        shell: bash
        run: |
          echo "=== Reading diff coverage result ==="
          result_file="build/reports/coverage/report.txt"
          echo "result_file: $result_file"
          if [ ! -f "$result_file" ]; then
            echo "ERROR: diff coverage result file was not generated"
            echo "=== Coverage directory ==="
            find build/reports/coverage -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi
          cat "$result_file"
          {
            echo 'result<<EOF'
            cat "$result_file"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Find existing coverage comment
        uses: peter-evans/find-comment@v3
        id: coverage-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- diff-coverage-report -->'

      - name: Create coverage comment
        if: steps.coverage-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- diff-coverage-report -->
            ## 🧪 Test Coverage

            ```text
            ${{ steps.coverage.outputs.result }}
            ```

            📊 Detailed JaCoCo report is available in the workflow artifacts.

      - name: Update coverage comment
        if: steps.coverage-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.coverage-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- diff-coverage-report -->
            ## 🧪 Test Coverage

            ```text
            ${{ steps.coverage.outputs.result }}
            ```

            📊 Detailed JaCoCo report is available in the workflow artifacts.

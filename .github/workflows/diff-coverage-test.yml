name: Diff Coverage Experiment

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-coverage:
    name: Diff coverage
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate JaCoCo
        run: gradle jacocoTestReport --no-daemon

      - name: Generate diff coverage
        id: diff-coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set +e
          gradle diffCoverage --no-daemon \
            --args="--diffSha=$BASE_SHA --report=build/reports/jacoco/test/jacocoTestReport.xml"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Publish HTML report artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/
          if-no-files-found: error

      - name: Read diff coverage result
        id: coverage
        shell: bash
        env:
          DIFF_EXIT_CODE: ${{ steps.diff-coverage.outputs.exit_code }}
        run: |
          result_file="build/reports/coverage/report.txt"

          if [ -f "$result_file" ]; then
            {
              echo 'result<<EOF'
              cat "$result_file"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          elif [ "$DIFF_EXIT_CODE" = "0" ]; then
            {
              echo 'result<<EOF'
              echo 'ℹ️ No changed code lines were available for coverage analysis.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'result<<EOF'
              echo '❌ Coverage report could not be generated.'
              echo
              echo 'Check the workflow logs for details.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing coverage comment
        uses: peter-evans/find-comment@v4
        id: coverage-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- diff-coverage-report -->'

      - name: Create or update coverage comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.coverage-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- diff-coverage-report -->
            ## 🧪 Test Coverage

            ${{ steps.coverage.outputs.result }}

            📊 Detailed JaCoCo report is available in the workflow artifacts.

      - name: Fail if diff coverage failed
        if: steps.diff-coverage.outputs.exit_code != '0'
        run: exit 1

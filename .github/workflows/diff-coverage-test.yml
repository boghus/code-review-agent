name: Diff Coverage Experiment

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-coverage:
    name: Diff coverage
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug Git context
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "=== GitHub context ==="
          echo "event: $EVENT_NAME"
          echo "ref: $REF"
          echo "base_sha: $BASE_SHA"
          echo "head_sha: $HEAD_SHA"
          echo "github_sha: $GITHUB_SHA"
          echo
          echo "=== Git status ==="
          git status --short
          echo
          echo "=== Current commit ==="
          git rev-parse HEAD
          echo
          echo "=== Changed files: base -> HEAD ==="
          git diff --name-status "$BASE_SHA" "$HEAD_SHA"
          echo
          echo "=== Changed source files: base -> HEAD ==="
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.groovy' '*.java' '*.kt'

      - name: Generate JaCoCo
        run: |
          echo "=== Generating JaCoCo report ==="
          gradle jacocoTestReport --no-daemon
          echo
          echo "=== JaCoCo files ==="
          find build/reports/jacoco -maxdepth 4 -type f -print | sort
          echo
          echo "=== JaCoCo XML ==="
          test -f build/reports/jacoco/test/jacocoTestReport.xml
          wc -c build/reports/jacoco/test/jacocoTestReport.xml

      - name: Generate diff coverage
        id: diff-coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          echo "=== Running diff coverage ==="
          echo "diffSha: $BASE_SHA"
          echo "headSha: $HEAD_SHA"
          echo "report: build/reports/jacoco/test/jacocoTestReport.xml"

          set +e
          gradle reportDiffCoverage --no-daemon \
            --diffSha="$BASE_SHA" \
            --report=build/reports/jacoco/test/jacocoTestReport.xml
          exit_code=$?
          set -e

          echo "diff coverage exit code: $exit_code"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo
          echo "=== Coverage report directory ==="
          if [ -d build/reports/coverage ]; then
            find build/reports/coverage -maxdepth 3 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          else
            echo "build/reports/coverage does not exist"
          fi

      - name: Publish HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/
          if-no-files-found: error

      - name: Read diff coverage result
        id: coverage
        shell: bash
        env:
          DIFF_EXIT_CODE: ${{ steps.diff-coverage.outputs.exit_code }}
        run: |
          echo "=== Reading diff coverage result ==="
          result_file="build/reports/coverage/report.txt"
          echo "result_file: $result_file"
          echo "diff coverage exit code: $DIFF_EXIT_CODE"

          if [ -f "$result_file" ]; then
            cat "$result_file"
            {
              echo 'result<<EOF'
              cat "$result_file"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          elif [ "$DIFF_EXIT_CODE" = "0" ]; then
            echo "No coverage report was generated because no changed coverable code was detected."
            {
              echo 'result<<EOF'
              echo 'ℹ️ No changed code lines were available for coverage analysis.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: diff coverage failed and no report was generated"
            {
              echo 'result<<EOF'
              echo '❌ Coverage report could not be generated.'
              echo
              echo 'Check the workflow logs for details.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing coverage comment
        uses: peter-evans/find-comment@v3
        id: coverage-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- diff-coverage-report -->'

      - name: Create or update coverage comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.coverage-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- diff-coverage-report -->
            ## 🧪 Test Coverage

            ${{ steps.coverage.outputs.result }}

            📊 Detailed JaCoCo report is available in the workflow artifacts.

      - name: Fail if diff coverage failed
        if: steps.diff-coverage.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Diff coverage failed with exit code ${{ steps.diff-coverage.outputs.exit_code }}"
          exit 1

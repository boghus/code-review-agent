name: Revision OpenRabbit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: revision-open-rabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenRabbit review
    runs-on: ubuntu-latest
    # QA PRs use the dedicated Code Review Agent validation path and must not
    # trigger the second automatic reviewer.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && !startsWith(github.event.pull_request.head.ref, 'qa/')
    steps:
      - name: OpenRabbit review
        uses: aryanbrite/openrabbit@0350c5ff79e6efb3ba92898a46a2e420ae1c526c # v0.8.7
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"

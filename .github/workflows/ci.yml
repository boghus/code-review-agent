name: Examples CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  SELF_REVIEW_MINIMAX_MODEL: MiniMax-M3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build --no-daemon
      - run: gradle test --no-daemon
      - name: Verify GitHub token isolation
        shell: bash
        run: bash scripts/security-check-github-token.sh

  self-review:
    name: Self-review with Code Review Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Show self-review configuration
        shell: bash
        run: |
          echo "Code Review Agent self-review provider: minimax"
          echo "Code Review Agent self-review model: ${SELF_REVIEW_MINIMAX_MODEL}"
          echo "Code Review Agent self-review language: es"

      # Run the action from this PR instead of a published tag. This makes
      # the repository capable of reviewing changes to the reviewer itself.
      - name: Run self-review
        uses: ./
        with:
          api-key: ${{ secrets.Mininax_API_KEY }}
          model: ${{ env.SELF_REVIEW_MINIMAX_MODEL }}
          provider: minimax
          language: es
          github-token: ${{ github.token }}

name: Examples CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  SELF_REVIEW_GEMINI_MODEL: gemini-3.6-flash

jobs:
  context:
    name: Determine pipeline context
    runs-on: ubuntu-latest
    outputs:
      is_qa: ${{ steps.context.outputs.is_qa }}
      run_build: ${{ steps.context.outputs.run_build }}
      run_tests: ${{ steps.context.outputs.run_tests }}
      run_self_review: ${{ steps.context.outputs.run_self_review }}
      run_second_reviewer: ${{ steps.context.outputs.run_second_reviewer }}
      allow_merge: ${{ steps.context.outputs.allow_merge }}
    steps:
      - id: context
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          is_qa=false
          run_build=true
          run_tests=true
          run_self_review=false
          run_second_reviewer=true
          allow_merge=true

          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == qa/* ]]; then
            is_qa=true
            run_build=false
            run_tests=false
            run_self_review=true
            run_second_reviewer=false
            allow_merge=false
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            run_self_review=true
          fi

          echo "is_qa=$is_qa" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"
          echo "run_self_review=$run_self_review" >> "$GITHUB_OUTPUT"
          echo "run_second_reviewer=$run_second_reviewer" >> "$GITHUB_OUTPUT"
          echo "allow_merge=$allow_merge" >> "$GITHUB_OUTPUT"

  build:
    needs: context
    if: needs.context.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assemble --no-daemon

  tests:
    needs: context
    if: needs.context.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test --no-daemon
      - name: Verify GitHub token isolation
        shell: bash
        run: bash scripts/security-check-github-token.sh

  self-review:
    needs: context
    name: Self-review with Code Review Agent
    if: needs.context.outputs.run_self_review == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Show self-review configuration
        shell: bash
        run: |
          echo "Pipeline context: ${{ needs.context.outputs.is_qa == 'true' && 'qa' || 'development' }}"
          echo "Code Review Agent self-review provider: gemini"
          echo "Code Review Agent self-review model: ${SELF_REVIEW_GEMINI_MODEL}"
          echo "Code Review Agent self-review language: es"

      # Run the action from this PR instead of a published tag. This makes
      # the repository capable of reviewing changes to the reviewer itself.
      - name: Run self-review
        uses: ./
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          model: ${{ env.SELF_REVIEW_GEMINI_MODEL }}
          provider: gemini
          language: es
          github-token: ${{ github.token }}

  qa-merge-guard:
    needs: context
    name: QA merge guard
    if: needs.context.outputs.is_qa == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain QA merge restriction
        shell: bash
        run: |
          echo "🧪 Esta es una rama de QA, por lo tanto este PR no puede mergearse."
          echo "QA PRs are validation-only and must not be merged through the normal flow."

      - name: Find existing QA notice
        uses: peter-evans/find-comment@v3
        id: qa-notice
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- qa-merge-guard -->'

      - name: Create QA notice
        if: steps.qa-notice.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- qa-merge-guard -->
            ## 🧪 QA validation only

            This PR is targeting a **QA branch** and is intended for validation only.

            **It will not be merged through the normal development flow.**

            - Build and normal tests are skipped.
            - The Code Review Agent still runs.
            - The second reviewer is skipped.
            - This PR must not be merged.

      - name: Update QA notice
        if: steps.qa-notice.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.qa-notice.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- qa-merge-guard -->
            ## 🧪 QA validation only

            This PR is targeting a **QA branch** and is intended for validation only.

            **It will not be merged through the normal development flow.**

            - Build and normal tests are skipped.
            - The Code Review Agent still runs.
            - The second reviewer is skipped.
            - This PR must not be merged.

      # Require this check in repository branch protection to make the
      # validation-only nature of QA PRs an enforced merge restriction.
      - name: Block QA merge
        shell: bash
        run: |
          echo "QA merge is intentionally blocked."
          exit 1
